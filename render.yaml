services:
  - type: web
    name: forcemind-dashboard
    runtime: node
    plan: free
    buildCommand: >
      npm install &&
      npx playwright install chromium &&
      sudo apt-get update &&
      sudo apt-get install -y libgbm-dev libnss3 libatk-bridge2.0-0 libxkbcommon0 libgtk-3-0 libasound2
    startCommand: node server/index.js
    healthCheckPath: /api/suites
    envVars:
      - key: NODE_ENV
        value: production
      - key: DASHBOARD_PORT
        value: 10000
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/.cache/ms-playwright
      # Add your secrets in Render Dashboard:
      # GITHUB_TOKEN
      # LLM_PROVIDER
      # JIRA_HOST
      # JIRA_EMAIL
      # JIRA_API_TOKEN
