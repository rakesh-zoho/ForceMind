services:
  - type: web
    name: forcemind-dashboard
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: bash start.sh
    healthCheckPath: /api/suites
    envVars:
      - key: NODE_ENV
        value: production
      - key: DASHBOARD_PORT
        value: 10000
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/.cache/ms-playwright
      # Add your secrets in Render Dashboard:
      # GITHUB_TOKEN
      # LLM_PROVIDER
      # JIRA_HOST
      # JIRA_EMAIL
      # JIRA_API_TOKEN
